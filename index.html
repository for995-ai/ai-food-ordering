<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="description" content="食癒所 AI 智能點餐系統，從正式菜單中找到適合您的餐點。" />
    <title>食癒所｜AI 智能點餐</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header" aria-label="食癒所資訊列">
        <button class="brand" type="button" data-route="home" aria-label="返回首頁">
          <span class="brand-mark" aria-hidden="true">食</span>
          <span class="brand-name">食癒所</span>
        </button>
        <div class="table-number">桌號：<strong>A1</strong></div>
        <div class="header-caption">您的專屬 AI 健康管家</div>
      </header>

      <main id="app" class="app-content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="常用服務">
        <button type="button" data-action="service-bell">
          <span class="nav-icon" aria-hidden="true">♢</span>
          <span>服務鈴</span>
        </button>
        <button type="button" data-action="toggle-font">
          <span class="nav-icon nav-text-icon" aria-hidden="true">Aa</span>
          <span>調整字體</span>
        </button>
        <button type="button" data-route="cart" class="cart-nav-button">
          <span class="nav-icon" aria-hidden="true">袋</span>
          <span>購物車</span>
          <span id="cart-badge" class="cart-badge" hidden>0</span>
        </button>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>此點餐系統需要啟用 JavaScript 才能使用。</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
